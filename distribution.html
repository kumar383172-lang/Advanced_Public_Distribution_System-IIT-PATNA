<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Start Distribution | Smart PDS</title>
<link rel="icon" type="png" href="logo.png">
<link rel="stylesheet" href="dstyle.css">
</head>

<body>

<!-- HEADER -->
<header class="header">
<div class="header-inner">

<img src="logo.png" alt="Smart PDS Logo" class="header-logo">

<div class="header-text">
<h1>Advanced Public Distribution System</h1>
<h2>Dealer Dashboard</h2>
<p>Start Ration Distribution</p>
</div>

</div>
</header>



<!-- PAGE TITLE -->
<section class="section card">
<h3 class="section-title">Ration Distribution</h3>
<p>Select a beneficiary and confirm ration distribution.</p>
</section>

<!-- DISTRIBUTION IMAGE -->
<section class="section">
  <div class="distribution-image">
    <img src="Ration-Distribution.jpg" alt="Ration Distribution">
  </div>
</section>

<!-- BENEFICIARY DETAILS -->
<section class="section card">

<h3>Beneficiary Details</h3>

<div class="form-group">
<label>Ration Card Number</label>
<input type="text" placeholder="Enter Ration Card Number">
</div>

<div class="form-group">
<label>Beneficiary Name</label>
<input type="text" placeholder="Enter Beneficiary Name">
</div>

<div class="form-group">
<label>Family Members</label>
<input type="number" placeholder="Enter Number of Members">
</div>

</section>


<!-- DISTRIBUTION DETAILS -->
<section class="section card">

<h3>Ration Details</h3>

<div class="form-group">
<label>Rice Quantity (kg)</label>
<input type="number" placeholder="Rice Quantity">
</div>

<div class="form-group">
<label>Wheat Quantity (kg)</label>
<input type="number" placeholder="Wheat Quantity">
</div>

<div class="form-group">
<label>Other Items</label>
<input type="text" placeholder="Optional">
</div>

</section>



<!-- CONFIRM DISTRIBUTION -->
<section class="section card utility-section">

<button class="action-btn">Confirm Distribution</button>

</section>

<!-- UTILITY -->
<section class="section card utility-section">

<a href="index.html">
<button class="secondary-btn">Back to Dashboard</button>
</a>

</section>

<!-- FOOTER -->
<footer class="footer">
© 2026 Smart PDS Portal | Dealer Module  
<br>Contact | Help | Support
</footer>

</body>
</html>
